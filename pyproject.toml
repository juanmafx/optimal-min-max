[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "py-low-hig"
version = "1.0.0"
description = "Streaming integer extrema with the optimal pairwise comparison bound and reproducible sampling."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Juan Manuel Ramallo" }]
dependencies = []

[project.scripts]
py-low-hig = "py_low_hig.cli.main:main"

[dependency-groups]
dev = [
    "coverage==7.13.0",
    "hypothesis==6.148.7",
    "mypy==1.19.0",
    "pytest==9.0.3",
    "pytest-cov==7.0.0",
    "ruff==0.15.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/py_low_hig"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib -p no:cacheprovider --strict-markers --strict-config"
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["py_low_hig"]


[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "src"
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RET", "PTH", "PL", "RUF", "BLE", "T10"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "PLR2004"]
"scripts/**" = ["S314", "S603"]
"src/py_low_hig/sampling/uniform.py" = ["S311"]
